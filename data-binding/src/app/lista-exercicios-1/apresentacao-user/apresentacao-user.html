<label >Nome: </label><br>
<input type="text" class="white" [(ngModel)]="nome"> <br>
<label >Idade: </label><br>
<input type="number" class="white" [(ngModel)]="idade"> <br>
<label >Curso: </label><br>
<input type="text" class="white" [(ngModel)]="curso"> <br>

<p>Olá, meu nome é {{nome}}, tenho {{idade}} anos e curso {{curso}}</p>
